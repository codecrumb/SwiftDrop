name = "swiftdrop"
workers_dev = true
compatibility_date = "2024-11-24"
main = "worker.js"
preview_urls = true

# Static UI served from public/. run_worker_first keeps the worker's
# HTTP->HTTPS redirect on the HTML route (workers.dev has no zone-level
# "Always Use HTTPS"); all other assets are served directly and free.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/index.html"]

# Durable Object for WebSocket signaling
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "SignalingRoom"

# R2 bucket for fallback file storage
[[r2_buckets]]
binding = "FILE_STORAGE"
bucket_name = "swiftdrop"

[[durable_objects.bindings]]
name = "NEARBY"
class_name = "NearbyLobby"

# Durable Object migrations
[[migrations]]
tag = "v2"
new_sqlite_classes = ["SignalingRoom"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["NearbyLobby"]

# Scheduled cleanup (runs every 5 minutes)
[triggers]
crons = ["*/5 * * * *"]

# Observability settings
[observability]
[observability.logs]
enabled = false
head_sampling_rate = 1
invocation_logs = true
persist = true